name: publish-frontend-image

# Builds the console image from the committed Dockerfile.multiarch and publishes
# it to GitHub Container Registry. The TypeScript/Vite build always runs on the
# build platform, so this produces a real amd64+arm64 manifest without QEMU.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'Dockerfile.multiarch'
      - 'Makefile'
      - '.github/workflows/publish-frontend-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-frontend-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_BRAND_NAME=KubeCube
          tags: |
            ghcr.io/${{ github.repository_owner }}/kubecube-front:latest
            ghcr.io/${{ github.repository_owner }}/kubecube-front:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
