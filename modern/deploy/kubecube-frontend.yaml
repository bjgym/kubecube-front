apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecube-frontend-modern
  namespace: kubecube-system
  labels:
    app: kubecube-frontend-modern
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubecube-frontend-modern
  template:
    metadata:
      labels:
        app: kubecube-frontend-modern
    spec:
      containers:
        - name: frontend
          image: docker.io/kubecube/frontend:modern3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubecube-frontend-modern
  namespace: kubecube-system
  labels:
    app: kubecube-frontend-modern
spec:
  type: NodePort
  selector:
    app: kubecube-frontend-modern
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
